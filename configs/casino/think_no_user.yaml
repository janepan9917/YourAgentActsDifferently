# CaSiNo campsite negotiation using this repository's thinking protocol.

game_name: casino
log_dir: logs

game_params:
  enforce_original_constraints: true

orchestrator_settings:
  max_total_negotiation_turns: 60
  max_agent_user_turns: 60
  max_agent_user_exchanges: 20
  user_consultation_mode: natural
  generate_initial_user_guidance: false

agent_1:
  model: gpt-5.4-mini-2026-03-17
  api_key_name: OPENAI_API_KEY
  show_own_thinking: false
  use_structured_output: false
  prompts_path: prompts/thinking/agent_no_user_thinking.yaml
  no_user: true
  initial_reward: 100

agent_2:
  model: gpt-5.4-mini-2026-03-17
  api_key_name: OPENAI_API_KEY
  show_own_thinking: false
  use_structured_output: false
  prompts_path: prompts/thinking/agent_no_user_thinking.yaml
  no_user: true
  initial_reward: 100

user_1:
  type: none
  model: gpt-5.4-mini-2026-03-17
  api_key_name: OPENAI_API_KEY
  prompts_path: prompts/thinking/user_utility_faithful_v3.yaml
  initial_offer: ""
  private_info:
    value2issue:
      High: Firewood
      Medium: Food
      Low: Water
    value2reason:
      High: "We have a large group and need warmth through the night."
      Medium: "Extra food will support our group."
      Low: "We already brought enough water."

user_2:
  type: none
  model: gpt-5.4-mini-2026-03-17
  api_key_name: OPENAI_API_KEY
  prompts_path: prompts/thinking/user_utility_faithful_v3.yaml
  initial_offer: ""
  private_info:
    value2issue:
      High: Firewood
      Medium: Water
      Low: Food
    value2reason:
      High: "My dog and I need a warm fire."
      Medium: "I need to stay hydrated."
      Low: "I need little extra food."
