# opening_only_user (Opening-Only User ablation): buy_sell, Qwen/Qwen3.8-Flash.
sweep_id: single_user_buy_sell_initial_consult_only_qwen38_flash_pilot
n_runs: 50
combos:
- id: user_on_agent_1
  base: configs/buy_sell/think_harness_fixed.yaml
  base_id: user_on_agent_1
  label: buy_sell harness/setting, qwen38_flash agent (user always gpt-5.6-terra),
    initial_consult_only ablation, user_on_agent_1
  metadata:
    game: buy_sell_harness_fixed
    proposal_schema_version: explicit_gives_json_v1
    user_side: agent_1
    user_condition: initial_consult_only
    negotiation_turn_limit: 40
    agent_provider: togetherai
    agent_model: Qwen/Qwen3.8-Flash
    user_provider: openai
    user_model: gpt-5.6-terra
    reasoning_mode: provider_default
  overrides:
    log_dir: logs/opening_only_user
    orchestrator_settings.max_total_negotiation_turns: 40
    orchestrator_settings.generate_initial_user_guidance: true
    agent_1.provider: togetherai
    agent_1.model: Qwen/Qwen3.8-Flash
    agent_1.api_key_name: TOGETHERAI_API_KEY
    agent_1.max_tokens: 8192
    agent_1.stream: true
    agent_2.provider: togetherai
    agent_2.model: Qwen/Qwen3.8-Flash
    agent_2.api_key_name: TOGETHERAI_API_KEY
    agent_2.max_tokens: 8192
    agent_2.stream: true
    agent_1.prompts_path: prompts/thinking/single_user/agent_natural_user_thinking.yaml
    agent_2.no_user: true
    agent_2.prompts_path: prompts/thinking/agent_no_user_thinking.yaml
    user_1.type: initial_consult_only
    user_2.type: none
    user_1.model: gpt-5.6-terra
  n_runs: 50
