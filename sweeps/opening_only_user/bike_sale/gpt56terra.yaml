# opening_only_user (Opening-Only User ablation): bike_sale, gpt-5.6-terra.
sweep_id: single_user_principal_bench_stripped_sanity_negot_01_initial_consult_only_pilot
n_runs: 50
combos:
- id: user_on_agent_1
  base: configs/principal_bench_stripped/think_luna.yaml
  base_id: user_on_agent_1
  label: PB sanity-negot-01 (stripped), GPT-5.6 Terra self-play, opening-only user on agent_1
    only
  metadata:
    game: principal_bench_stripped
    setting_id: pb-sanity-negot-01
    user_side: agent_1
    user_condition: initial_consult_only
    negotiation_turn_limit: 60
    agent_provider: openai
    agent_model: gpt-5.6-terra
    reasoning_mode: provider_default
  overrides:
    log_dir: logs/opening_only_user
    orchestrator_settings.max_total_negotiation_turns: 60
    orchestrator_settings.generate_initial_user_guidance: true
    agent_1.provider: openai
    agent_1.model: gpt-5.6-terra
    agent_1.api_key_name: OPENAI_API_KEY
    agent_2.provider: openai
    agent_2.model: gpt-5.6-terra
    agent_2.api_key_name: OPENAI_API_KEY
    game_params.setting_id: pb-sanity-negot-01
    user_1.type: initial_consult_only
    agent_2.no_user: true
    agent_1.prompts_path: prompts/thinking/single_user/agent_natural_user_thinking.yaml
    agent_2.prompts_path: prompts/thinking/agent_no_user_thinking.yaml
    user_2.type: none
    user_2.prompts_path: prompts/thinking/single_user/user_principal_bench_natural_thinking.yaml
    user_1.model: gpt-5.6-terra
  n_runs: 50
- id: user_on_agent_2
  base: configs/principal_bench_stripped/think_luna.yaml
  base_id: user_on_agent_2
  label: PB sanity-negot-01 (stripped), GPT-5.6 Terra self-play, opening-only user on agent_2
    only
  metadata:
    game: principal_bench_stripped
    setting_id: pb-sanity-negot-01
    user_side: agent_2
    user_condition: initial_consult_only
    negotiation_turn_limit: 60
    agent_provider: openai
    agent_model: gpt-5.6-terra
    reasoning_mode: provider_default
  overrides:
    log_dir: logs/opening_only_user
    orchestrator_settings.max_total_negotiation_turns: 60
    orchestrator_settings.generate_initial_user_guidance: true
    agent_1.provider: openai
    agent_1.model: gpt-5.6-terra
    agent_1.api_key_name: OPENAI_API_KEY
    agent_2.provider: openai
    agent_2.model: gpt-5.6-terra
    agent_2.api_key_name: OPENAI_API_KEY
    game_params.setting_id: pb-sanity-negot-01
    user_2.type: initial_consult_only
    agent_1.no_user: true
    agent_2.prompts_path: prompts/thinking/single_user/agent_natural_user_thinking.yaml
    agent_1.prompts_path: prompts/thinking/agent_no_user_thinking.yaml
    user_1.type: none
    user_1.prompts_path: prompts/thinking/single_user/user_principal_bench_natural_thinking.yaml
    user_2.model: gpt-5.6-terra
  n_runs: 50
