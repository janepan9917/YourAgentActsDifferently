# passive_user: deal_or_no_deal, Qwen/Qwen3.7-Plus.
# Logs: data/raw/passive_user/single_user_deal_or_no_deal_silent_qwen37_plus_pilot/
sweep_id: single_user_deal_or_no_deal_silent_qwen37_plus_pilot
n_runs: 50
combos:
- id: user_on_agent_1
  base: configs/deal_or_no_deal/think.yaml
  base_id: user_on_agent_1
  label: deal_or_no_deal harness/setting, qwen37_plus agent,
    silent ablation, user_on_agent_1
  metadata:
    game: deal_or_no_deal
    user_side: agent_1
    user_condition: silent
    negotiation_turn_limit: 40
    agent_provider: togetherai
    agent_model: Qwen/Qwen3.7-Plus
    reasoning_mode: provider_default
  overrides:
    agent_1.api_key_name: TOGETHERAI_API_KEY
    agent_1.max_tokens: 8192
    agent_1.model: Qwen/Qwen3.7-Plus
    agent_1.prompts_path: prompts/thinking/single_user/agent_natural_user_thinking.yaml
    agent_1.provider: togetherai
    agent_1.stream: true
    agent_2.api_key_name: TOGETHERAI_API_KEY
    agent_2.max_tokens: 8192
    agent_2.model: Qwen/Qwen3.7-Plus
    agent_2.no_user: true
    agent_2.prompts_path: prompts/thinking/agent_no_user_thinking.yaml
    agent_2.provider: togetherai
    agent_2.stream: true
    log_dir: logs/passive_user
    orchestrator_settings.generate_initial_user_guidance: true
    orchestrator_settings.max_total_negotiation_turns: 40
    user_1.type: silent
    user_2.type: none
  n_runs: 50
