# passive_user: ultimatum, claude-sonnet-5.
# Logs: data/raw/passive_user/single_user_ultimatum_silent_claudesonnet5_pilot/
sweep_id: single_user_ultimatum_silent_claudesonnet5_pilot
n_runs: 50
combos:
- id: user_on_agent_1
  base: configs/ultimatum/think_harness_fixed.yaml
  base_id: user_on_agent_1
  label: ultimatum harness/setting, claudesonnet5 agent,
    silent ablation, user_on_agent_1
  metadata:
    game: ultimatum_harness_fixed
    proposal_schema_version: explicit_gives_json_v1
    user_side: agent_1
    user_condition: silent
    negotiation_turn_limit: 40
    agent_provider: anthropic
    agent_model: claude-sonnet-5
    reasoning_mode: provider_default
  overrides:
    log_dir: logs/passive_user
    orchestrator_settings.max_total_negotiation_turns: 40
    orchestrator_settings.generate_initial_user_guidance: true
    agent_1.provider: anthropic
    agent_1.model: claude-sonnet-5
    agent_1.api_key_name: ANTHROPIC_API_KEY
    agent_2.provider: anthropic
    agent_2.model: claude-sonnet-5
    agent_2.api_key_name: ANTHROPIC_API_KEY
    agent_1.prompts_path: prompts/thinking/single_user/agent_natural_user_thinking.yaml
    agent_2.no_user: true
    agent_2.prompts_path: prompts/thinking/agent_no_user_thinking.yaml
    user_1.type: silent
    user_2.type: none
  n_runs: 50
- id: user_on_agent_2
  base: configs/ultimatum/think_harness_fixed.yaml
  base_id: user_on_agent_2
  label: ultimatum harness/setting, claudesonnet5 agent,
    silent ablation, user_on_agent_2
